<!doctype html>
<html lang="es" data-lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#08090b" />
    <meta name="description" content="Tridi convierte video de personas en experiencia para robots humanoides: movimiento 3D y políticas entrenadas en física real." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns=%27http://www.w3.org/2000/svg%27%20viewBox=%270%200%2032%2032%27%3E%3Cpath%20fill=%27%23c8ff2e%27%20d=%27M16%202l12.1%207L16%2016%203.9%209z%27/%3E%3Cpath%20fill=%27%239fd61c%27%20d=%27M3.9%209%2016%2016v14L3.9%2023z%27/%3E%3Cpath%20fill=%27%236b8f0e%27%20d=%27M28.1%209%2016%2016v14l12.1-7z%27/%3E%3Cpath%20fill=%27none%27%20stroke=%27%2308090b%27%20stroke-width=%271.8%27%20d=%27M16%2016%206.3%2010.4M16%2016l9.7-5.6M16%2016v11.4%27/%3E%3Ccircle%20fill=%27%2308090b%27%20cx=%2716%27%20cy=%279.4%27%20r=%272.5%27/%3E%3Crect%20fill=%27%2308090b%27%20x=%2713.7%27%20y=%2713.7%27%20width=%274.6%27%20height=%274.6%27/%3E%3C/svg%3E" />
    <script>
      // Language before the first paint, so the page never flashes the wrong one (src/i18n.js):
      // a link's ?lang= (this visit only), the saved choice, the browser's language, else English.
      (function () {
        var langs = ['es', 'en'];
        var saved = null;
        try { saved = localStorage.getItem('tridi-lang'); } catch (e) {}
        var asked = new URLSearchParams(location.search).get('lang');
        var browser = (navigator.languages || [navigator.language]).map(function (l) { return String(l).slice(0, 2); }).find(function (l) { return langs.indexOf(l) >= 0; });
        var lang = [asked, saved, browser, 'en'].find(function (l) { return langs.indexOf(l) >= 0; });
        document.documentElement.dataset.lang = lang;
        document.documentElement.lang = lang;
      })();
    </script>
    <title>Tridi — de video a robots que aprenden a moverse</title>
  </head>
  <body>
    <div id="app" tabindex="-1"></div>
    <p id="app-loading" role="status">Cargando…</p>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
